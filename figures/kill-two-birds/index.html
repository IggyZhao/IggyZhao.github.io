<text class="venue" x="72" y="62">MOBILE APP MULTIHOMING &#183; CROSS-PLATFORM SDKS</text>
<text class="title" x="70" y="112">Kill Two Birds</text>
<text class="title it" x="70" y="160">with One Stone</text>
<text class="claim" x="72" y="204">Multihoming lifts an app&#8217;s quality at home, most of all</text>

<text class="claim" x="72" y="256">what is learned on Android flows back to iOS through it.</text>

<!-- method -->
<text class="eb" x="72" y="668">METHOD</text>
<text class="mt" x="72" y="690">Staggered difference-in-differences on 51,585 iOS apps observed</text>
<text class="mt" x="72" y="709">weekly, May 2019 to January 2022: 2,667 that expanded to Android</text>
<text class="mt" x="72" y="728">against 48,918 that stayed on iOS. Platform SDKs detected for every</text>
<text class="mt" x="72" y="747">app on both stores. Interactive fixed effects, matrix completion and</text>
<text class="mt" x="72" y="766">Callaway-Sant&#8217;Anna estimators; 872 developer posts read alongside.</text>
<text class="mt em" x="72" y="800">The ring is the paper&#8217;s week-by-week estimate for each configuration.</text>

    document.getElementById('frame').style.marginTop = Math.max(16, (window.innerHeight - 900 * s) / 2) + 'px';
  }
  fit(); window.addEventListener('resize', fit);
})();</script>
</body>
</html>
