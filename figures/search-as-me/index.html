<!-- method -->
<text class="eb" x="72" y="668">METHOD</text>
<text class="mt" x="72" y="690">Randomized 3 &#215; 2 experiment, 194 participants: a startup market</text>
<text class="mt" x="72" y="709">analysis scored on eight items, with one, two or three search tools,</text>
<text class="mt" x="72" y="728">and the search process either visible to one&#8217;s team or private.</text>
<text class="mt" x="72" y="747">The AI-augmented sessions were screen-recorded with think-aloud and</text>
<text class="mt" x="72" y="766">coded every 5 seconds into 8 states; semi-Markov paths, phases, HHI.</text>
<text class="mt em" x="72" y="800">Each thread is one session, on the spoke of the tool in use.</text>
